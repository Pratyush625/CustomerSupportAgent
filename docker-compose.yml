services:
  api:
    build: .
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      WORKSPACE_DIR: /app
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - model_cache:/home/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  dashboard:
    build: .
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./app.py:/app/app.py:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
  model_cache:
